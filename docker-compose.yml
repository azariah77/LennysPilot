services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lenny_user
      POSTGRES_PASSWORD: lenny_password
      POSTGRES_DB: lenny_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny_user -d lenny_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://lenny_user:lenny_password@db:5432/lenny_db
      - ENVIRONMENT=development
      # For Windows/Mac Docker to talk to host's ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
